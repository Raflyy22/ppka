<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Control Center — PPKA Simulator</title><link rel="stylesheet" href="/assets/css/app.css"><style>
.admin-shell{min-height:100vh;background:var(--bg)}.admin-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(8,14,22,.88);backdrop-filter:blur(16px);position:sticky;top:0;z-index:50}
.admin-main{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}.admin-side{padding:18px 12px;border-right:1px solid var(--line);background:rgba(11,18,28,.55)}.admin-tabs{display:grid;gap:5px}.admin-tab{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;font:inherit}.admin-tab:hover,.admin-tab.active{color:var(--text);background:var(--surface-2)}.admin-content{padding:28px;max-width:1500px;width:100%;margin:auto}.admin-brand{display:flex;align-items:center;gap:10px}.admin-brand .brand-mark{width:34px;height:34px}.admin-live{font-size:11px;color:#86efac;display:flex;align-items:center;gap:7px}.admin-live i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.12)}.admin-activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.admin-activity:last-child{border-bottom:0}.admin-activity small{display:block;color:var(--muted);margin-top:3px}.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:#38bdf8}.activity-dot.warning{background:#eab308}.activity-dot.danger{background:#ef4444}
@media(max-width:800px){.admin-main{grid-template-columns:1fr}.admin-side{position:sticky;top:64px;z-index:40;overflow:auto}.admin-tabs{display:flex;overflow:auto}.admin-tab{white-space:nowrap}.admin-content{padding:18px}}
</style></head>
<body><div class="admin-shell">
<header class="admin-top"><div class="admin-brand"><div class="brand-mark">🚆</div><div><strong>PPKA Admin</strong><small style="display:block;color:var(--muted)">Control Center</small></div></div><div class="profile" id="admin-profile"><div class="avatar" id="admin-avatar">A</div><div><strong id="admin-name">Admin</strong><small id="admin-role">Administrator</small></div><button class="btn" id="logout-btn">Keluar</button></div></header>
<div class="admin-main"><aside class="admin-side"><nav class="admin-tabs">
<button class="admin-tab active" data-tab="overview">◈ Overview</button><button class="admin-tab" data-tab="users">👥 Users</button><button class="admin-tab" data-tab="schedules">🗓️ Schedules</button><button class="admin-tab" data-tab="stations">🚉 Stations</button><button class="admin-tab" data-tab="trains">🚆 Trains</button><button class="admin-tab" data-tab="scenarios">🎮 Scenarios</button><button class="admin-tab" data-tab="audit">🛡️ Audit Log</button><a class="admin-tab" href="/">← Kembali ke App</a>
</nav></aside><main class="admin-content" id="admin-content"><div class="empty">Loading...</div></main></div></div><div id="toast-root"></div>
<script type="module">import {openModal,closeModal} from "/assets/js/admin-utils.js";window.openModal=openModal;window.closeModal=closeModal;document.querySelector("#logout-btn").onclick=()=>document.dispatchEvent(new CustomEvent("admin-logout"));</script>
<script type="module">
import "/assets/js/admin.js";
document.addEventListener("admin-logout",async()=>{const {api}=await import("/assets/js/admin-utils.js");try{await api("/api/auth/logout",{method:"POST"})}catch{}location.href="/login.html"});
</script>
</body></html>
