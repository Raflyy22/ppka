<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PPKA Simulator — portal simulator operasi kereta api.">
<title>Masuk / Daftar — PPKA Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,rgba(255,176,32,.11),transparent 28%),radial-gradient(circle at 90% 90%,rgba(85,167,255,.08),transparent 25%),var(--bg)}
.auth-card{width:min(460px,100%);padding:30px}.auth-brand{text-align:center;margin-bottom:22px}.auth-brand .brand-mark{margin:auto}.auth-brand h1{font-family:"Space Grotesk";margin:15px 0 5px}.auth-brand p{color:var(--muted);font-size:13px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--surface-2);border-radius:12px;margin-bottom:18px}.auth-tab{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px}.auth-tab.active{background:var(--surface-3);color:var(--text);font-weight:700}.auth-form{display:grid;gap:14px}.auth-note{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:11px;line-height:1.6}.auth-note code{color:var(--accent)}.password-meter{height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden}.password-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--danger),var(--accent),var(--success));transition:.2s}
</style></head>
<body><main class="auth-page"><section class="card auth-card">
<div class="auth-brand"><div class="brand-mark">🚆</div><h1>PPKA Simulator</h1><p>Secure Operations Portal</p></div>
<div class="auth-tabs"><button class="auth-tab active" data-mode="login">Masuk</button><button class="auth-tab" data-mode="register">Daftar</button></div>
<form id="auth-form" class="auth-form" novalidate></form>
<div id="auth-note" class="auth-note"></div>
</section></main><div id="toast-root" class="toast-root"></div>
<script type="module" src="/assets/js/auth.js"></script></body></html>
