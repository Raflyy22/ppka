<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layanan Digital & Simulasi PPKA</title>
  <!-- FontAwesome &jspdf for PDF Generation -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #2563eb;
      --border-color: #e5e7eb;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --warning-color: #d97706;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --border-color: #334155;
    }

    * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid var(--border-color); }
    .theme-btn { background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .grid-container { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media(min-width: 900px) { .grid-container { grid-template-columns: 1fr 1fr; } }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .card-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* PPKA Dashboard Styling */
    .signal-box { display: flex; gap: 16px; align-items: center; background: rgba(0,0,0,0.05); padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .light-indicator { width: 24px; height: 24px; border-radius: 50%; background: #4b5563; }
    .light-indicator.green { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .light-indicator.red { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

    .visual-stage { height: 120px; border: 2px dashed var(--border-color); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; position: relative; overflow: hidden; margin-bottom: 16px; }
    .flag-s40 { width: 40px; height: 40px; border-radius: 50%; background: var(--success-color); border: 4px solid white; display: none; align-items: center; justify-content: center; color: white; }
    .train-sprite { font-size: 2.5rem; transition: transform 3s ease-in-out; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { background: var(--accent-color); color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Log Output */
    .log-box { background: #000; color: #00ff66; font-family: monospace; padding: 10px; border-radius: 6px; height: 100px; overflow-y: auto; font-size: 0.85rem; margin-top: 12px; }

    /* Form & Checkout */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.9rem; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-color); }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2><i class="fa-solid fa-server"></i> Control Center & Digital Services</h2>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Toggle Mode</button>
  </div>

  <div class="grid-container">

    <!-- MODUL 1: SIMULASI MEJA PPKA (SEMBOYAN VISUAL) -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-train"></i> Meja Operasional PPKA (Simulasi Semboyan)</div>
      
      <div class="signal-box">
        <span>Status Sinyal Keluar:</span>
        <div id="signalLight" class="light-indicator red"></div>
        <strong id="signalText">BAHAYA (RED)</strong>
      </div>

      <div class="visual-stage">
        <div id="s40Visual" class="flag-s40" title="Semboyan 40"><i class="fa-solid fa-check"></i></div>
        <div id="trainSprite" class="train-sprite"><i class="fa-solid fa-train-subway"></i></div>
      </div>

      <div class="btn-group">
        <button class="action-btn" onclick="setSignal('CLEAR')">Buka Sinyal (Hijau)</button>
        <button class="action-btn" onclick="setSignal('DANGER')">Tutup Sinyal (Merah)</button>
        <button id="btnS40" class="action-btn" style="background: var(--success-color);" onclick="triggerSemboyan40()" disabled>Semboyan 40 (PPKA)</button>
      </div>

      <div class="log-box" id="ppkaLog">> Sistem Meja PPKA Siap. Silakan buka sinyal keluar...</div>
    </div>

    <!-- MODUL 2: TRANSAKSI & INVOICE PDF GENERATOR -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-receipt"></i> Transaksi & Invoice Generator</div>
      
      <form id="orderForm" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label>Nama Pengguna / Pelanggan:</label>
          <input type="text" id="custName" class="form-control" required placeholder="Contoh: Ezar Rafiansyah">
        </div>
        <div class="form-group">
          <label>Layanan / Produk Digital:</label>
          <select id="itemSelect" class="form-control">
            <option value="Top-up Game Item - 100 Diamond|50000">Top-up Game Item (Rp 50.000)</option>
            <option value="Middleman Escrow Service|25000">Jasa Middleman/Escrow (Rp 25.000)</option>
            <option value="Akses Mod Addon Sim|75000">Lisensi Addon Trainz Sim (Rp 75.000)</option>
          </select>
        </div>
        <div class="form-group">
          <label>ID Target / Account No:</label>
          <input type="text" id="targetId" class="form-control" required placeholder="Masukkan ID Game / No Rekber">
        </div>
        <button type="submit" class="action-btn" style="width: 100%; margin-top: 8px;">Proses & Cetak Invoice PDF</button>
      </form>
    </div>

  </div>

  <script>
    /* ========================================================
       1. TEMA DARK / LIGHT MODE
       ======================================================== */
    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
    }

    /* ========================================================
       2. LOGIKA SIMULASI SEMBOYAN MEJA PPKA (40, 41, 35)
       ======================================================== */
    const ppkaState = {
      signalAspect: 'DANGER',
      s40Active: false,
      s41Active: false,
      s35Active: false
    };

    function appendLog(msg) {
      const logBox = document.getElementById('ppkaLog');
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `<br>> [${time}] ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setSignal(aspect) {
      ppkaState.signalAspect = aspect;
      const light = document.getElementById('signalLight');
      const text = document.getElementById('signalText');
      const btnS40 = document.getElementById('btnS40');

      if (aspect === 'CLEAR') {
        light.className = 'light-indicator green';
        text.innerText = 'AMAN (GREEN)';
        btnS40.disabled = false;
        appendLog('PPKA mengubah sinyal keluar menjadi AMAN.');
      } else {
        light.className = 'light-indicator red';
        text.innerText = 'BAHAYA (RED)';
        btnS40.disabled = true;
        resetDispatch();
        appendLog('PPKA mengembalikan sinyal keluar ke BAHAYA.');
      }
    }

    function triggerSemboyan40() {
      if (ppkaState.signalAspect !== 'CLEAR') return;
      
      ppkaState.s40Active = true;
      document.getElementById('s40Visual').style.display = 'flex';
      appendLog('Semboyan 40 diangkat oleh PPKA (Papan bundar hijau dipaparkan).');

      // Memicu Semboyan 41 secara otomatis setelah 1.5 detik
      setTimeout(triggerSemboyan41, 1500);
    }

    function triggerSemboyan41() {
      if (!ppkaState.s40Active) return;
      
      ppkaState.s41Active = true;
      appendLog('Semboyan 41: Kondektur membunyikan peluit panjang balasan.');

      // Memicu Semboyan 35 dari masinis setelah 1.5 detik
      setTimeout(triggerSemboyan35, 1500);
    }

    function triggerSemboyan35() {
      if (!ppkaState.s41Active) return;

      ppkaState.s35Active = true;
      appendLog('Semboyan 35: Masinis menjawab suling lokomotif (Booooooft!).');
      
      // Kereta Berangkat
      const train = document.getElementById('trainSprite');
      train.style.transform = 'translateX(250px)';
      appendLog('Rangkaian Kereta Api resmi berangkat meninggalkan emplasemen.');

      setTimeout(resetDispatch, 4000);
    }

    function resetDispatch() {
      ppkaState.s40Active = false;
      ppkaState.s41Active = false;
      ppkaState.s35Active = false;
      document.getElementById('s40Visual').style.display = 'none';
      const train = document.getElementById('trainSprite');
      train.style.transform = 'translateX(0px)';
    }

    /* ========================================================
       3. TRANSAKSI DIGITAL & GENERATOR INVOICE PDF
       ======================================================== */
    function handleCheckout(e) {
      e.preventDefault();
      
      const custName = document.getElementById('custName').value;
      const targetId = document.getElementById('targetId').value;
      const itemRaw = document.getElementById('itemSelect').value.split('|');
      const itemName = itemRaw[0];
      const itemPrice = parseInt(itemRaw[1]);

      const invoiceId = 'INV-' + Math.floor(100000 + Math.random() * 900000);
      const dateStr = new Date().toLocaleDateString('id-ID');

      // Cetak PDF via jsPDF
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("NOTA / INVOICE TRANSAKSI DIGITAL", 20, 20);

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`No. Invoice : ${invoiceId}`, 20, 30);
      doc.text(`Tanggal     : ${dateStr}`, 20, 35);
      doc.text(`Pelanggan   : ${custName}`, 20, 40);
      doc.text(`Target ID   : ${targetId}`, 20, 45);

      doc.line(20, 50, 190, 50);

      doc.setFont("helvetica", "bold");
      doc.text("Deskripsi Produk / Layanan", 20, 60);
      doc.text("Harga", 160, 60);

      doc.setFont("helvetica", "normal");
      doc.text(itemName, 20, 70);
      doc.text(`Rp ${itemPrice.toLocaleString('id-ID')}`, 160, 70);

      doc.line(20, 75, 190, 75);

      doc.setFont("helvetica", "bold");
      doc.text("Total Pembayaran", 20, 85);
      doc.text(`Rp ${itemPrice.toLocaleString('id-ID')}`, 160, 85);

      doc.setFontSize(9);
      doc.setFont("helvetica", "italic");
      doc.text("Terima kasih telah melakukan transaksi di platform layanan kami.", 20, 105);

      // Save PDF
      doc.save(`${invoiceId}.pdf`);
      alert(`Transaksi Berhasil! Invoice ${invoiceId} telah diunduh.`);
    }
  </script>
</body>
</html>
